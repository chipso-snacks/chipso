<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="icon" type="image/jpeg" href="https://i.ibb.co/vC8zXkYv/8bdef540-3dd4-4e14-a286-50fda186c916.jpg">

<title>Order Now | Chipso Snaxx Premium</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@300;400;600;800&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>

:root {
    --bg-dark: #0d0e12;
    --card-bg: rgba(22, 24, 33, 0.75);
    --card-border: rgba(255, 255, 255, 0.08);
    --text-main: #f5f6fa;
    --text-sub: #a0a5b5;
    
    /* Multi-color accents matched with Logo */
    --accent-blue: #00a2ff;
    --accent-green: #2ed573;
    --accent-yellow: #ffa502;
    --accent-red: #ff4757;
    
    --btn-gradient: linear-gradient(135deg, #ffa502 0%, #ff4757 100%);
    --btn-hover: linear-gradient(135deg, #ffb833 0%, #ff6b81 100%);
    --glow-shadow: 0 10px 30px rgba(255, 71, 87, 0.25);
}

body {
    font-family: 'Outfit', 'Poppins', sans-serif;
    margin:0;
    background-color: var(--bg-dark);
    color: var(--text-main);
    position:relative;
    min-height: 100vh;
    overflow-x: hidden;
}

/* Vibrant background glow blurs matched with Logo colors */
body::before {
    content: '';
    position: absolute;
    top: 10%;
    left: -10%;
    width: 450px;
    height: 450px;
    background: var(--accent-blue);
    filter: blur(180px);
    opacity: 0.18;
    z-index: -1;
    border-radius: 50%;
}

body::after {
    content: '';
    position: absolute;
    top: 50%;
    right: -10%;
    width: 500px;
    height: 500px;
    background: var(--accent-red);
    filter: blur(200px);
    opacity: 0.15;
    z-index: -1;
    border-radius: 50%;
}

/* --- GLASSMORPHISM HEADER --- */
header {
    background: rgba(22, 24, 33, 0.4);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border-bottom: 1px solid var(--card-border);
    padding: 50px 20px;
    text-align:center;
    position: relative;
}

/* --- 3D BUBBLE LOGO TEXT --- */
.chipso-title {
    font-family: 'Fredoka', sans-serif;
    font-size: 4.5rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: -2px;
    display: flex;
    justify-content: center;
    align-items: center;
    line-height: 1;
}

.chipso-title span {
    display: inline-block;
    position: relative;
    background-clip: text;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(2px 6px 8px rgba(0, 0, 0, 0.5))
            drop-shadow(-1px -2px 2px rgba(255, 255, 255, 0.8));
    transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    padding: 0 2px;
}

.chipso-title span:hover {
    transform: translateY(-5px) scale(1.08);
}

/* Logo Gradient Colors for CHIPSO */
.c-c { background: linear-gradient(180deg, #0d82df 0%, #00a2ff 60%, #005bc5 100%); }
.c-h { background: linear-gradient(180deg, #00bdf1 0%, #00d2ff 50%, #0093e0 100%); }
.c-i { background: linear-gradient(180deg, #00d3b7 0%, #00c9a7 50%, #00876c 100%); }
.c-p { background: linear-gradient(180deg, #64dd17 0%, #76ff03 50%, #388e3c 100%); }
.c-s { background: linear-gradient(180deg, #ffca28 0%, #ffa000 50%, #f57c00 100%); }
.c-o { background: linear-gradient(180deg, #ff5252 0%, #ff1744 50%, #b71c1c 100%); }

header h2 {
    margin: 8px 0 15px 0;
    color: #ffffff;
    font-size: 1.8rem;
    text-transform: lowercase;
    font-weight: 400;
    letter-spacing: 3px;
}

header p {
    font-weight: 400;
    font-size: 1.1rem;
    color: var(--text-sub);
    margin: 0;
}

.back-btn {
    position:absolute;
    top: 25px;
    left: 20px;
    background: rgba(255, 255, 255, 0.08);
    color: var(--text-main);
    border: 1px solid var(--card-border);
    padding: 10px 22px;
    border-radius:50px;
    font-size:0.85rem;
    font-weight:700;
    cursor:pointer;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
    z-index: 10;
}

.back-btn:hover {
    background: var(--accent-red);
    color: white;
    transform: translateX(-3px);
    border-color: transparent;
}

.back-btn:active {
    transform:scale(0.95);
}

/* Floating Premium Dark Order Container */
.order-container {
    max-width:480px;
    margin: 50px auto;
    background: var(--card-bg);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    padding: 40px;
    border-radius: 24px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    border: 1px solid var(--card-border);
    box-sizing: border-box;
}

.order-container h2 {
    font-size: 1.6rem;
    font-weight: 700;
    margin-top: 0;
    margin-bottom: 30px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: #fff;
}

.snack-icon {
    height: 9.5rem; 
    width:auto;
    object-fit: contain;
}

label {
    font-size:0.85rem;
    font-weight:700;
    display:block;
    margin-bottom: 8px;
    color: var(--text-sub);
    text-transform: uppercase;
    letter-spacing: 0.8px;
}

input,
textarea {
    width:100%;
    padding: 14px 18px;
    margin-bottom: 24px;
    border: 1px solid var(--card-border);
    border-radius: 14px;
    box-sizing:border-box;
    font-family: 'Poppins', sans-serif;
    font-size: 0.95rem;
    transition: all 0.3s ease;
    background: rgba(255, 255, 255, 0.04);
    color: #fff;
}

input::placeholder,
textarea::placeholder {
    color: rgba(255, 255, 255, 0.3);
}

/* Accent highlight on focus */
input:focus,
textarea:focus {
    outline: none;
    border-color: var(--accent-yellow);
    background: rgba(255, 255, 255, 0.08);
    box-shadow: 0 0 15px rgba(255, 165, 2, 0.2);
}

.readonly-box {
    background: rgba(0, 0, 0, 0.25);
    color: var(--accent-yellow);
    font-weight: 600;
    cursor: not-allowed;
    border-color: var(--card-border);
}

/* Premium Gradient Button */
button.submit-btn {
    background: var(--btn-gradient);
    color: #fff;
    padding: 18px;
    border:none;
    width:100%;
    border-radius: 50px;
    font-size: 1.1rem;
    font-weight: 800;
    cursor:pointer;
    text-transform:uppercase;
    letter-spacing: 0.8px;
    box-shadow: var(--glow-shadow);
    transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
    margin-top: 10px;
}

button.submit-btn:hover {
    background: var(--btn-hover);
    transform: translateY(-3px);
    box-shadow: 0 12px 35px rgba(255, 71, 87, 0.4);
}

button.submit-btn:disabled {
    background: rgba(255, 255, 255, 0.1);
    color: #666;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
}

footer {
    text-align:center;
    padding:40px 20px;
    background: #090a0d;
    color: var(--text-sub);
    font-size:0.85rem;
    margin-top: 80px;
    border-top: 1px solid var(--card-border);
}

/* Responsive optimization - Keeps back button fixed at the top-left in mobile view */
@media (max-width: 768px) {
    header { padding: 50px 16px 30px 16px; }
    .chipso-title { font-size: 3.2rem; }
    .back-btn { 
        position: absolute; 
        top: 15px; 
        left: 15px; 
        padding: 6px 14px;
        font-size: 0.8rem;
    }
    .order-container { width: 92%; margin: 30px auto; padding: 25px; border-radius: 20px; }
}

@media (max-width: 480px) {
    .chipso-title { font-size: 2.8rem; }
    .order-container { padding: 20px; }
    .snack-icon { height: 5.5rem; }
    input, textarea { padding: 12px 14px; margin-bottom: 18px; font-size: 0.9rem; }
    button.submit-btn { font-size: 1rem; padding: 15px; }
}

</style>
</head>

<body>

<header>

<button onclick="history.back()" class="back-btn">
← Back
</button>

<h1 class="chipso-title">
    <span class="c-c">C</span><span class="c-h">h</span><span class="c-i">i</span><span class="c-p">p</span><span class="c-s">s</span><span class="c-o">o</span>
</h1>
<h2>snaxx</h2>

<p>"പറയാൻ രസം, കഴിക്കാൻ അതിലേറെ രസം"</p>

</header>

<div class="order-container">

<h2>
<img src="https://i.ibb.co/7JZ7QSHb/b01492d9-eadd-4772-a7ee-32fd867b9a66-removebg-preview.png" class="snack-icon">
Secure Checkout
</h2>

<form id="orderForm">

<label>Full Name</label>
<input type="text" id="name" placeholder="Your Name" required>

<label>WhatsApp Number</label>
<input type="text" id="phone" placeholder="Contact Number" required>

<label>Delivery Address</label>
<textarea id="address" rows="3" placeholder="Flat No, Street, Landmark, Pin" required></textarea>

<label>Items in Your Cart</label>
<textarea id="productList" rows="3" class="readonly-box" readonly></textarea>

<label>Total Amount (₹)</label>
<input type="text" id="totalDisplay" class="readonly-box" readonly>

<button type="submit" class="submit-btn">
Confirm Your Order
</button>

</form>

</div>

<script>

window.onload = function(){

    let summary = localStorage.getItem("fullOrderSummary");
    let total = localStorage.getItem("totalOrderAmount");

    if(summary){

        document.getElementById("productList").value = summary;
        document.getElementById("totalDisplay").value = total;

    }else{

        alert("Please add items to cart first!");
        window.location.href = "cart.html";

    }

};

document.getElementById("orderForm").addEventListener("submit", function(e){

    e.preventDefault();

    const btn = document.querySelector(".submit-btn");

    btn.innerHTML = "Opening WhatsApp...";
    btn.disabled = true;

    // CUSTOMER DETAILS
    let name = document.getElementById("name").value;
    let phone = document.getElementById("phone").value;
    let address = document.getElementById("address").value;
    let products = document.getElementById("productList").value;
    let total = document.getElementById("totalDisplay").value;

    // YOUR WHATSAPP NUMBER
    let ownerNumber = "919495603617";

    // MESSAGE
    let message =
`🛒 *NEW ORDER - CHIPSO SNAXX*

👤 Name: ${name}

📞 Phone: ${phone}

🏠 Address:
${address}

🧾 Ordered Items:
${products}

💰 Total Amount: ₹${total}`;

    // ENCODE MESSAGE
    let encodedMessage = encodeURIComponent(message);

    // WHATSAPP LINK
    let whatsappURL =
`https://wa.me/${ownerNumber}?text=${encodedMessage}`;

    // CLEAR CART
    localStorage.removeItem("cart");
    localStorage.removeItem("fullOrderSummary");
    localStorage.removeItem("totalOrderAmount");

    // OPEN WHATSAPP
    window.location.href = whatsappURL;

});

</script>

<footer>
&copy; 2026 Chipso Snaxx. Premium Quality Kerala Snacks.
</footer>

</body>
</html>
