<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Success | Kyachee Snaxx Premium</title>
    <link rel="icon" type="image/jpeg" href="https://i.ibb.co/vC8zXkYv/8bdef540-3dd4-4e14-a286-50fda186c916.jpg">
    
    <!-- Modern Google Fonts (Poppins + Outfit) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #ffcc00 0%, #ff5252 100%);
            --premium-gold: linear-gradient(135deg, #ffe066 0%, #f5b041 50%, #d4ac0d 100%);
            --gold-hover: linear-gradient(135deg, #ffd433 0%, #f39c12 100%);
            --secondary-light-red: #ff7675;
            --dark-color: #0f0f11;
            --white: #ffffff;
            --accent: #2ecc71; /* Modern Premium Green */
            --glass-border: rgba(255, 255, 255, 0.25);
            --luxury-shadow: 0 30px 60px rgba(0,0,0,0.12), 0 10px 25px rgba(0,0,0,0.05);
        }

        body {
            margin: 0;
            font-family: 'Outfit', 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fffbf0 0%, #fff3f3 50%, #fffcf5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Premium Background Glow Effects */
        .bg-glow-1 {
            position: absolute;
            top: 20%;
            left: 20%;
            width: 400px;
            height: 400px;
            background: #ffcc00;
            filter: blur(150px);
            border-radius: 50%;
            opacity: 0.15;
            z-index: -1;
        }

        .bg-glow-2 {
            position: absolute;
            bottom: 20%;
            right: 20%;
            width: 400px;
            height: 400px;
            background: #ff5252;
            filter: blur(150px);
            border-radius: 50%;
            opacity: 0.12;
            z-index: -1;
        }

        /* Glassmorphism Success Container */
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.45);
            padding: 50px 35px;
            border-radius: 32px;
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            max-width: 420px;
            width: 85%;
            box-shadow: var(--luxury-shadow);
            animation: containerFadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes containerFadeUp {
            0% { transform: translateY(30px); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .icon-box {
            width: 90px;
            height: 90px;
            background: var(--accent);
            color: white;
            font-size: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            margin: 0 auto 25px;
            box-shadow: 0 10px 25px rgba(46, 204, 113, 0.3);
            animation: scaleUp 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.2s both;
        }

        @keyframes scaleUp {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            color: var(--dark-color);
            font-size: 2.2rem;
            margin-bottom: 12px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        p {
            color: #444;
            font-size: 1.05rem;
            margin-bottom: 35px;
            line-height: 1.6;
            font-weight: 400;
        }

        /* Premium Golden Button (Rounded) */
        .btn-home {
            padding: 16px 45px;
            border: none;
            border-radius: 50px;
            background: var(--premium-gold);
            color: #4a3300;
            font-weight: 800;
            font-size: 0.95rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.165, 0.84, 0.44, 1);
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 5px 15px rgba(212, 172, 13, 0.25);
            letter-spacing: 0.5px;
        }

        .btn-home:hover {
            background: var(--dark-color);
            color: #ffcc00;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(15, 15, 17, 0.25);
        }

        .confetti {
            position: absolute;
            width: 8px;
            height: 8px;
            top: -10px;
            border-radius: 50%;
            animation: fall 3.5s linear infinite;
            z-index: 10;
        }

        @keyframes fall {
            to { transform: translateY(105vh) rotate(360deg); }
        }

        @media (max-width: 480px) {
            .container { padding: 40px 20px; width: 90%; }
            h1 { font-size: 1.8rem; }
            p { font-size: 0.95rem; margin-bottom: 25px; }
            .btn-home { padding: 14px 35px; font-size: 0.85rem; }
            .icon-box { width: 80px; height: 80px; font-size: 38px; }
        }
    </style>
</head>

<body>

    <!-- Soft Ambient Glow Layers -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <!-- Main Card Container -->
    <div class="container">
        <div class="icon-box">✓</div>
        <h1>Order Confirmed!</h1>
        <p>Thank you for choosing Kyachee Snaxx. We've received your order and started preparing your fresh snacks! 🍟</p>
        
        <a href="index.html" class="btn-home">Back to Store</a>
    </div>

    <script>
        // Premium subtle confetti splash
        function createConfetti() {
            const colors = ['#ffcc00', '#ff7675', '#2ecc71', '#ffe066'];
            for(let i=0; i<40; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.animationDelay = Math.random() * 2.5 + 's';
                confetti.style.animationDuration = (Math.random() * 1.5 + 2.5) + 's';
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                // Randomize sizing slightly for a layered depth look
                const size = Math.random() * 6 + 6;
                confetti.style.width = size + 'px';
                confetti.style.height = size + 'px';
                document.body.appendChild(confetti);
            }
        }
        createConfetti();
    </script>

</body>
</html>
