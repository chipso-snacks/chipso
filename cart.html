<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cart - Chipso Snaxx</title>
    <link rel="icon" type="image/jpeg" href="logo.jpg">
    <link rel="apple-touch-icon" href="logo.jpg">

<!-- Modern Google Fonts (Fredoka + Poppins + Outfit) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Outfit:wght@300;400;600;800&family=Poppins:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
:root { 
    --bg-light: #fffdfa;
    --bg-secondary: #fff7ed;
    --card-bg: #ffffff;
    --card-border: rgba(245, 158, 11, 0.15);
    --text-main: #1f2937;
    --text-sub: #4b5563;
    
    /* Yellow, Orange & Dark Slate Accents */
    --primary-orange: #f97316;
    --primary-yellow: #eab308;
    --dark-heading: #1e293b;
    --accent-red: #ef4444;
    
    /* Dark Slate Blue Theme (Same as Nav & Contact) */
    --nav-contact-bg: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    
    --btn-gradient: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%);
    --btn-hover: linear-gradient(135deg, #fbbf24 0%, #f97316 100%);
    --glow-shadow: 0 10px 25px rgba(234, 88, 12, 0.25);
}

body { 
    font-family: 'Outfit', 'Poppins', sans-serif; 
    margin:0; 
    background-color: var(--bg-light);
    color: var(--text-main);
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
}

/* Subtle background glow blurs */
body::before {
    content: '';
    position: absolute;
    top: 5%;
    left: -10%;
    width: 450px;
    height: 450px;
    background: #fef08a;
    filter: blur(160px);
    opacity: 0.6;
    z-index: -1;
    border-radius: 50%;
}

body::after {
    content: '';
    position: absolute;
    top: 50%;
    right: -10%;
    width: 500px;
    height: 500px;
    background: #ffedd5;
    filter: blur(180px);
    opacity: 0.7;
    z-index: -1;
    border-radius: 50%;
}

/* --- DARK SLATE HEADER (MATCHED WITH NAV & CONTACT) --- */
header { 
    background: var(--nav-contact-bg);
    border-bottom: 3px solid var(--primary-orange);
    padding: 25px 30px; 
    text-align: center; 
    font-size: 24px; 
    font-weight: 800; 
    letter-spacing: 0.5px;
    position: relative;
    color: #ffffff;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
}

.back-btn {
    position: absolute;
    top: 20px;
    left: 20px;
    background: rgba(255, 255, 255, 0.12);
    color: #ffffff;
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 10px 22px;
    border-radius: 50px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.3s ease;
    backdrop-filter: blur(10px);
}

.back-btn:hover { 
    background: var(--primary-orange); 
    color: white; 
    transform: translateX(-3px);
    border-color: transparent;
}
.back-btn:active { transform: scale(0.95); }

h2 { 
    text-align: center; 
    margin-top: 50px; 
    font-size: 2rem;
    font-weight: 700;
    color: var(--dark-heading); 
}

/* Premium Light Floating Table Container */
.table-container { 
    width:92%; 
    max-width:950px; 
    margin:30px auto; 
    background: var(--card-bg); 
    border-radius: 20px; 
    box-shadow: 0 10px 30px rgba(245, 158, 11, 0.08); 
    overflow: hidden; 
    border: 1px solid var(--card-border);
}

table { width:100%; border-collapse:collapse; min-width: 500px; }
th, td { padding: 18px 20px; text-align:center; border-bottom:1px solid var(--card-border); }

/* --- THEAD DARK SLATE BLUE THEME --- */
th { 
    background: var(--nav-contact-bg); 
    font-weight: 700; 
    color: #ffffff; 
    text-transform: uppercase; 
    font-size: 0.85rem; 
    letter-spacing: 0.8px;
    border-bottom: 2px solid var(--primary-orange);
}

.product-cell { display: flex; align-items: center; gap: 16px; text-align: left; }
.cart-img { width: 55px; height: 55px; object-fit: cover; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.06); }
.product-cell span { font-weight: 600; color: var(--dark-heading); }

/* Light Quantity Controls */
.qty-controls-wrapper {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fff7ed;
    padding: 6px 12px;
    border-radius: 50px;
    width: fit-content;
    margin: 0 auto;
    border: 1px solid rgba(249, 115, 22, 0.2);
}

.qty-btn { 
    background: #ffffff; 
    border: 1px solid rgba(249, 115, 22, 0.3); 
    width: 28px; 
    height: 28px; 
    cursor: pointer; 
    border-radius: 50%; 
    font-weight: bold; 
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary-orange);
    transition: all 0.2s ease;
    box-shadow: 0 2px 5px rgba(0,0,0,0.05);
}
.qty-btn:hover { background: var(--primary-orange); color: white; border-color: var(--primary-orange); }
.qty-val { margin: 0 12px; font-weight: 700; font-size: 1rem; color: var(--dark-heading); }

.remove-btn { 
    background: #fef2f2; 
    color: var(--accent-red); 
    border: 1px solid #fecaca; 
    padding: 8px 14px; 
    border-radius: 50px; 
    cursor: pointer; 
    font-weight: 600;
    transition: all 0.2s ease;
}
.remove-btn:hover { background: var(--accent-red); color: #fff; border-color: var(--accent-red); }

.total-section { 
    text-align: center; 
    font-size: 28px; 
    margin: 40px 20px 20px 20px; 
    font-weight: 800; 
    color: var(--primary-orange); 
}

/* Premium Gradient Button */
.btn { 
    display: block; 
    margin: 20px auto 60px; 
    padding: 18px 60px; 
    background: var(--btn-gradient); 
    color: #fff;
    border: none; 
    border-radius: 50px; 
    cursor: pointer; 
    font-weight: 800; 
    font-size: 1.2rem; 
    text-transform: uppercase;
    letter-spacing: 0.8px;
    box-shadow: var(--glow-shadow);
    transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1); 
}
.btn:hover { 
    background: var(--btn-hover); 
    transform: translateY(-4px); 
    box-shadow: 0 15px 35px rgba(234, 88, 12, 0.45);
}

/* Responsive spacing optimizations */
@media (max-width: 768px) {
    header { padding: 25px; font-size: 22px; }
    .back-btn { position: static; display: inline-block; margin: 0 0 15px 0; padding: 8px 18px; }
    h2 { margin-top: 25px; font-size: 1.6rem; }
}

@media (max-width: 600px) { 
    header { font-size: 20px; padding: 20px; } 
    .table-container { width: 95%; margin: 15px auto; border-radius: 14px; }
    th, td { padding: 12px 10px; font-size: 0.9rem; }
    .cart-img { width: 42px; height: 42px; border-radius: 8px; }
    .product-cell { gap: 10px; }
    .qty-controls-wrapper { padding: 4px 8px; }
    .qty-btn { width: 24px; height: 24px; font-size: 0.8rem; }
    .qty-val { margin: 0 8px; font-size: 0.9rem; }
    .remove-btn { padding: 6px 10px; font-size: 0.8rem; }
    .total-section { font-size: 22px; margin-top: 30px; }
    .btn { width: 90%; padding: 15px 20px; font-size: 1.05rem; }
}
</style>
</head>
<body>

<header>
    <button onclick="goBack()" class="back-btn">⬅ Back</button>
    Chipso Snaxx Cart 🛒
</header>

<h2>Your Items</h2>

<div class="table-container">
<table id="cartTable">
<thead>
    <tr>
    <th style="text-align: left; padding-left: 25px;">Product</th>
    <th>Price</th>
    <th>Qty</th>
    <th>Remove</th>
    </tr>
</thead>
<tbody id="cartBody"></tbody>
</table>
</div>

<div class="total-section" id="grandTotal">Total: ₹0</div>
<button class="btn" onclick="goToOrder()">Place Order Now</button>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];

function loadCart(){
    let tableBody = document.getElementById("cartBody");
    tableBody.innerHTML = "";
    let total = 0;

    if(cart.length === 0) {
        tableBody.innerHTML = "<tr><td colspan='4' style='padding:40px; color: var(--text-sub); font-weight:500;'>Your cart is empty!</td></tr>";
        document.getElementById("grandTotal").innerText = "Total: ₹0";
        return;
    }

    cart.forEach((item, index) => {
        let row = tableBody.insertRow();
        row.innerHTML = `
        <td>
            <div class="product-cell" style="padding-left: 10px;">
                <img src="${item.img}" class="cart-img">
                <span>${item.name}</span>
            </div>
        </td>
        <td style="font-weight: 700; color: var(--primary-orange);">₹${item.price}</td>
        <td>
            <div class="qty-controls-wrapper">
                <button class="qty-btn" onclick="updateQty(${index}, -1)">-</button>
                <span class="qty-val">${item.qty}</span>
                <button class="qty-btn" onclick="updateQty(${index}, 1)">+</button>
            </div>
        </td>
        <td>
            <button class="remove-btn" onclick="removeItem(${index})">✕</button>
        </td>
        `;
        total += item.price * item.qty;
    });

    document.getElementById("grandTotal").innerText = "Total: ₹" + total;
}

function updateQty(index, change) {
    if (cart[index].qty + change > 0) {
        cart[index].qty += change;
        saveAndReload();
    }
}

function removeItem(index){
    if(confirm("Remove this item?")) {
        cart.splice(index, 1);
        saveAndReload();
    }
}

function saveAndReload() {
    localStorage.setItem("cart", JSON.stringify(cart));
    loadCart();
}

function goToOrder(){
    if(!cart || cart.length === 0) {
        alert("Your cart is empty!");
        return;
    }
    
    let summary = cart.map(item => {
        let quantity = item.qty || 1;
        return `${item.name} x ${quantity}`;
    }).join(", ");

    let totalAmount = cart.reduce((sum, item) => sum + (Number(item.price) * Number(item.qty)), 0);

    localStorage.setItem("fullOrderSummary", summary);
    localStorage.setItem("totalOrderAmount", totalAmount);

    window.location.href = "orderchipso.html";
}

function goBack(){
    window.history.back();
}

loadCart();
</script>
</body>
</html>
